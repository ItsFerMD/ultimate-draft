<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Ultimate Draft PRO</title><style>:root{--bg:#070a13;--card:#111a2e;--acc:#00ff87;--gold:#ffd700;--txt:#fff}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:radial-gradient(circle,#1a233a,var(--bg));color:var(--txt);padding:15px;display:flex;justify-content:center}.box{width:100%;max-width:480px;background:rgba(22,31,50,.9);border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.05)}h1{color:var(--acc);font-size:26px;text-align:center;margin-bottom:15px;text-shadow:0 0 10px rgba(0,255,135,.3)}h2,h3{text-align:center;margin-bottom:12px;color:#a0aec0;font-weight:400}.hidden{display:none}input,select{width:100%;padding:12px;background:#070a13;border:1px solid #223254;border-radius:10px;color:#fff;margin-bottom:12px;font-size:16px}.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--acc),#00b359);color:#070a13;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px;box-shadow:0 4px 15px rgba(0,255,135,.3)}.bar{display:flex;justify-content:space-between;background:#070a13;padding:12px;border-radius:10px;margin-bottom:15px;border:1px solid #1a2640}.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.card{background:linear-gradient(135deg,#1e293b,#111827);border:2px solid #2e3f5e;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:var(--acc)}.card.legendary{background:linear-gradient(135deg,#2c1f03,#61460b,#1a1302);border-color:var(--gold)}.ovr{font-size:24px;font-weight:900;color:var(--acc)}.card.legendary .ovr{color:var(--gold)}.p-name{font-size:13px;font-weight:700;margin:5px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p-price{font-size:11px;color:#ffcd00;font-weight:bold}.pitch{background:linear-gradient(#113817,#0a220e);border:3px solid #1f5f29;border-radius:16px;min-height:290px;margin:15px 0;display:flex;flex-direction:column;justify-content:space-around;padding:12px;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}.row{display:flex;justify-content:space-around;width:100%}.p-slot{background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.3);width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;text-align:center;font-weight:bold;color:rgba(255,255,255,.6)}.p-slot.filled{background:linear-gradient(135deg,#00ff87,#009951);color:#070a13;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,255,135,.2)}.ticker{text-align:center;font-style:italic;margin:15px 0;font-size:15px;color:#cbd5e1;min-height:40px}</style></head><body><div class="box"><div id="s1"><h1>Ultimate Draft PRO</h1><h2>Configura tu Escuadra</h2><input type="text" id="name" value="Galácticos FC"><select id="bud"><option value="500">💰 \$500M (Modo Jeque - ¡Dinero Infinito!)</option><option value="250" selected>💰 \$250M (Presupuesto Rico)</option><option value="120">💰 \$120M (Clásico)</option></select><button class="btn" onclick="start()">Crear Club</button></div><div id="s2" class="hidden"><h2 id="t-title"></h2><div class="bar"><div>Fondos: <span id="s-bud" style="color:#ffcd00;font-weight:bold"></span></div><div>Media OVR: <span id="s-ovr" style="color:var(--acc);font-weight:bold">0</span></div></div><h3 id="r-title" style="font-size:14px;color:#718096">Ronda 1/11</h3><div class="pool" id="p-pool"></div><div class="pitch" id="pitch"></div><button id="b-tour" class="btn hidden" onclick="startTour()">🏆 Ir a la Fase de Torneo</button></div><div id="s3" class="hidden"><h1>Copa de Campeones</h1><div class="bar" style="justify-content:space-around;align-items:center"><div id="mA" style="font-weight:bold"></div><div id="mS" style="font-size:22px;color:var(--gold);font-weight:900;background:#070a13;padding:5px 15px;border-radius:8px}">0 - 0</div><div id="mB" style="font-weight:bold"></div></div><p class="ticker" id="tick"></p><button class="btn" id="b-sim" onclick="sim()">Simular Eliminatoria</button></div></div><script>let st={name:"Club",bud:100,round:1,picked:[],ovr:0};const db=[{n:"Messi Prime",o:94},{n:"Cristiano Ronaldo",o:93},{n:"Mbappé",o:92},{n:"Haaland",o:91},{n:"Vinícius Jr",o:91},{n:"Bellingham",o:90},{n:"De Bruyne",o:91},{n:"Rodri",o:91},{n:"Neymar Jr",o:89},{n:"Salah",o:89},{n:"Musiala",o:88},{n:"Lamine Yamal",o:87},{n:"Wirtz",o:88},{n:"Palmer",o:87},{n:"Kane",o:90},{n:"Van Dijk",o:90},{n:"Rüdiger",o:87},{n:"Saliba",o:88},{n:"Courtois",o:90},{n:"Ter Stegen",o:87},{n:"Ronaldinho",o:93},{n:"Ronaldo Nazário",o:94},{n:"Zidane",o:92},{n:"Cruyff",o:93}];function start(){st.name=document.getElementById('name').value;st.bud=parseFloat(document.getElementById('bud').value);document.getElementById('s1').classList.add('hidden');document.getElementById('s2').classList.remove('hidden');document.getElementById('t-title').innerText=st.name;const p=document.getElementById('pitch');p.innerHTML='';[["DC","DC"],["EI","MCO","ED"],["MC","MC"],["DFI","DFC","DFD"],["POR"]].forEach(r=>{let row=document.createElement('div');row.className='row';r.forEach(pos=>{let d=document.createElement('div');d.className='p-slot';d.id='sl-'+p.querySelectorAll('.p-slot').length;d.innerText=pos;row.appendChild(d)});p.appendChild(row)});gen();update()}function gen(){const c=document.getElementById('p-pool');c.innerHTML='';document.getElementById('r-title').innerText=`Mercado de Fichajes (Ronda ${st.round}/11)`;let shuffled=[...db].sort(()=>.5-Math.random()).slice(0,3);shuffled.forEach(p=>{let pr=(p.o*.15+3*Math.random()).toFixed(1);let isLeg=p.o>=92;let div=document.createElement('div');div.className=`card ${isLeg?'legendary':''}`;div.innerHTML=`<div class="ovr">${p.o}</div><div class="p-name">${p.n}</div><div class="p-price">$${pr}M</div>`;div.onclick=()=>{if(st.bud>=pr){st.bud-=pr;st.picked.push(p);let s=document.getElementById('sl-'+(st.picked.length-1));if(s){s.classList.add('filled');s.innerText=`${p.n}\n(${p.o})`}if(st.round<11){st.round++;gen()}else{document.getElementById('p-pool').classList.add('hidden');document.getElementById('b-tour').classList.remove('hidden')}st.ovr=Math.round(st.picked.reduce((a,b)=>a+b.o,0)/st.picked.length);update()}else{alert("¡Presupuesto insuficiente!")}};c.appendChild(div)})}function update(){document.getElementById('s-bud').innerText=`$${st.bud.toFixed(1)}M`;document.getElementById('s-ovr').innerText=st.ovr}function startTour(){document.getElementById('s2').classList.add('hidden');document.getElementById('s3').classList.remove('hidden');nextM()}function nextM(){document.getElementById('mA').innerText=st.name;document.getElementById('mB').innerText="Rival All-Stars";document.getElementById('mS').innerText="0 - 0";document.getElementById('tick').innerText="⚽ Los equipos saltan al campo. ¡El estadio ruge!"}function sim(){let a=Math.floor(4*Math.random())+(st.ovr>88?1:0),b=Math.floor(3*Math.random());if(a===b)a+=1;document.getElementById('mS').innerText=`${a} - ${b}`;if(a>b){document.getElementById('tick').innerHTML=`💥 ¡GOLAZO en el minuto 90!<br><b style="color:var(--gold);font-size:18px">🏆 ¡CAMPEONES DE LA COPA PRO! 🏆</b>`;document.getElementById('b-sim').innerText="Jugar Nuevo Draft";document.getElementById('b-sim').onclick=()=>location.reload()}else{document.getElementById('tick').innerHTML=`❌ Caíste derrotado en la prórroga.`;document.getElementById('b-sim').innerText="Volver a Intentarlo";document.getElementById('b-sim').onclick=()=>location.reload()}}</script></body></html>
